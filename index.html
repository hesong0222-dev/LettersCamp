<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="레터스 굿즈 부스 재고 관리 — 종류별 판매 버튼, 판매 기록, 가격 조정">
<meta name="theme-color" content="#16223A">
<title>레터스 굿즈 재고</title>
<style>
  :root {
    --paper: #EEF0F3;
    --card: #FFFFFF;
    --ink: #16223A;
    --muted: #5D6779;
    --line: #D6DAE1;
    --line-soft: #E6E9ED;
    --accent: #C31F3C;
    --accent-ink: #FFFFFF;
    --chip: #F4F6F8;
    --btn-bg: #16223A;
    --btn-fg: #FFFFFF;
    --shadow: 0 1px 2px rgba(22, 34, 58, .05), 0 8px 20px -14px rgba(22, 34, 58, .32);
    --sans: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;

    /* 화면 높이(vh)에 맞춰 줄어드는 치수 — 스크롤 대신 카드 자체가 작아져서
       어떤 화면 높이에서도 7장이 잘리거나 겹치지 않고 한 번에 들어간다.
       최대값은 아이패드에서 다듬은 기존 크기라, 화면이 충분히 크면
       이 전과 동일하게 보인다. 최솟값은 품목이 7개(4줄)로 늘어난 뒤
       기준으로 다시 낮췄다. */
    --pad-v: clamp(3px, 0.8vh, 10px);
    --gap-card: clamp(2px, 0.65vh, 6px);
    --gap-row: clamp(3px, 0.9vh, 7px);
    --fs-name: clamp(8.5px, 1.2vh, 13.5px);
    --fs-variant: clamp(6px, 0.8vh, 9.5px);
    --fs-tag: clamp(7px, 0.9vh, 10.5px);
    --fs-count: clamp(10px, 1.9vh, 20px);
    --gap-size: clamp(2px, 0.5vh, 6px);
    --szbtn-min: clamp(22px, 4vh, 44px);
    --fs-sz: clamp(8.5px, 1.25vh, 13px);
    --fs-left: clamp(5.5px, 0.75vh, 9px);
    --sell-h: clamp(20px, 3.8vh, 42px);
    --fs-sell: clamp(8.5px, 1.2vh, 13.5px);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #0E131C; --card: #161D29; --ink: #E9ECF2; --muted: #8B95A6;
      --line: #29323F; --line-soft: #1E2634; --accent: #FF5D74; --accent-ink: #1B0A0E;
      --chip: #1D2634; --btn-bg: #33445F; --btn-fg: #F2F5FA;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 12px 24px -16px rgba(0, 0, 0, .85);
    }
  }

  :root[data-theme="dark"] {
    --paper: #0E131C; --card: #161D29; --ink: #E9ECF2; --muted: #8B95A6;
    --line: #29323F; --line-soft: #1E2634; --accent: #FF5D74; --accent-ink: #1B0A0E;
    --chip: #1D2634; --btn-bg: #33445F; --btn-fg: #F2F5FA;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 12px 24px -16px rgba(0, 0, 0, .85);
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    line-height: 1.35;
    display: flex;
    flex-direction: column;
    -webkit-text-size-adjust: 100%;
    /* 노치·다이내믹 아일랜드·하단 홈 인디케이터 영역을 100dvh 안에서
       미리 빼둔다 — 이렇게 해야 그 아래 내용이 그 영역 밑에 깔려
       잘리지 않고, 화면 전체를 스크롤 없이 정확히 채운다는 전제도 깨지지 않는다. */
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  .band {
    flex: 0 0 auto;
    height: 6px;
    background: repeating-linear-gradient(45deg,
        var(--ink) 0 8px, var(--paper) 8px 16px,
        var(--accent) 16px 24px, var(--paper) 24px 32px);
  }

  .wrap {
    flex: 1 1 auto;
    min-height: 0;
    max-width: 1600px; width: 100%; margin: 0 auto; padding: 8px 10px;
    display: flex; flex-direction: column; gap: 6px;
  }

  /* ---------- 머리말 ---------- */
  .masthead { flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; row-gap: 4px; padding: 0 2px; }
  h1 { font-size: 15.5px; font-weight: 650; letter-spacing: -.01em; margin: 0; }
  .tally { font-family: var(--mono); font-size: 10.5px; color: var(--muted); font-variant-numeric: tabular-nums; letter-spacing: .02em; margin: 0; white-space: nowrap; }
  .tally b { color: var(--ink); font-weight: 600; }
  .tally .save-warn { color: var(--accent); font-weight: 600; }

  .head-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
  .backup-actions { display: flex; gap: 6px; }
  .miniBtn {
    height: 23px; padding: 0 9px; border-radius: 6px;
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    font-family: inherit; font-size: 10.5px; font-weight: 600; letter-spacing: .01em;
    cursor: pointer; white-space: nowrap;
  }
  .miniBtn:hover { border-color: var(--accent); color: var(--accent); }
  .miniBtn:active { transform: translateY(1px); }

  /* ---------- 판 ----------
     화면 전체를 정확히 채운다. 세로(폭<높이)는 재고를 위에, 기록·가격을
     그 아래 가로로 나눠 놓고, 가로(폭>=높이)는 재고와 사이드를 좌우로 놓는다.
     내용이 자리보다 많아지는 경우(판매 기록이 쌓일 때)에만 그 패널
     내부에서 스크롤하고, 화면 자체는 스크롤되지 않는다. */
  .board {
    flex: 1 1 auto; min-height: 0;
    display: grid; gap: 8px;
    grid-template-columns: 1fr;
    grid-template-rows: minmax(0, 1.3fr) minmax(0, 1fr);
  }
  .stock-list {
    min-height: 0; display: grid; gap: var(--gap-row);
    grid-template-columns: repeat(2, minmax(0, 1fr));
    grid-auto-rows: minmax(min-content, 1fr);
    overflow: hidden;
  }
  /* 기록·가격 패널은 기본은 위아래로 쌓는다 — 옆으로 나란히 놓으면
     폰 폭에서 가격표 칸이 좁아져 글자가 세로로 밀린다.
     가로로 나눠도 표가 읽히는 폭(세로 화면이면서 700px 이상)에서만 좌우로 놓는다. */
  .side { min-height: 0; display: flex; flex-direction: column; gap: 8px; }
  .side > .panel { flex: 1 1 0; min-width: 0; min-height: 0; }

  @media (orientation: landscape) {
    .board {
      grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr);
      grid-template-rows: minmax(0, 1fr);
    }
  }
  @media (orientation: portrait) and (min-width: 700px) {
    .side { flex-direction: row; }
  }

  /* ---------- 품목 카드 ---------- */
  .item {
    height: 100%;
    background: var(--card); border: 1px solid var(--line); border-radius: 11px;
    padding: var(--pad-v) 11px calc(var(--pad-v) + 1px);
    display: flex; flex-direction: column; justify-content: space-between; gap: var(--gap-card);
    box-shadow: var(--shadow);
  }
  .item.out { opacity: .55; }

  .item-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .variant { font-family: var(--mono); font-size: var(--fs-variant); letter-spacing: .09em; color: var(--muted); display: block; margin-bottom: 2px; }
  .name { font-size: var(--fs-name); font-weight: 600; letter-spacing: -.005em; line-height: 1.25; }
  .tag { font-family: var(--mono); font-size: var(--fs-tag); color: var(--muted); font-variant-numeric: tabular-nums; margin-top: 2px; }

  .count { text-align: right; flex: none; line-height: 1.1; }
  .count .n { font-family: var(--mono); font-size: var(--fs-count); font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -.02em; display: block; }
  .count .u { font-family: var(--mono); font-size: 9px; color: var(--muted); letter-spacing: .07em; }
  .count.low .n { color: var(--accent); }
  .flag { display: inline-block; font-family: var(--mono); font-size: 8.5px; letter-spacing: .05em; padding: 1px 5px; border-radius: 3px; margin-top: 3px; border: 1px solid var(--accent); color: var(--accent); }
  .flag[hidden] { display: none; }

  /* ---------- 판매 버튼 ---------- */
  button { font-family: inherit; touch-action: manipulation; }
  :where(button, input):focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .sell {
    width: 100%; height: var(--sell-h); border: 0; border-radius: 8px;
    background: var(--btn-bg); color: var(--btn-fg);
    font-size: var(--fs-sell); font-weight: 650; letter-spacing: .05em; cursor: pointer;
    transition: opacity .12s ease, transform .06s ease;
  }
  .sell:hover:not(:disabled) { opacity: .88; }
  .sell:active:not(:disabled) { transform: translateY(1px); }
  .sell:disabled { background: var(--line); color: var(--muted); cursor: not-allowed; }

  /* 사이즈도 하나하나가 판매 버튼이다 */
  .size-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--gap-size); }
  .szbtn {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: var(--szbtn-min); padding: 4px 3px;
    border: 1.5px solid var(--btn-bg); border-radius: 8px;
    background: var(--card); color: var(--ink); cursor: pointer;
    transition: background .12s ease, color .12s ease, transform .06s ease;
  }
  .szbtn .sz { font-family: var(--mono); font-size: var(--fs-sz); font-weight: 650; letter-spacing: .02em; line-height: 1.15; }
  .szbtn .left { font-family: var(--mono); font-size: var(--fs-left); color: var(--muted); font-variant-numeric: tabular-nums; letter-spacing: .03em; line-height: 1.2; }
  .szbtn:hover:not(:disabled) { background: var(--btn-bg); color: var(--btn-fg); }
  .szbtn:hover:not(:disabled) .left { color: var(--btn-fg); opacity: .75; }
  .szbtn:active:not(:disabled) { transform: translateY(1px); }
  .szbtn:disabled { border-color: var(--line); color: var(--muted); background: var(--chip); cursor: not-allowed; }
  .szbtn:disabled .sz { text-decoration: line-through; }

  /* ---------- 공용 패널 ---------- */
  .panel {
    height: 100%; min-height: 0;
    background: var(--card); border: 1px solid var(--line); border-radius: 11px;
    box-shadow: var(--shadow);
    display: flex; flex-direction: column;
  }
  .panel-head {
    flex: 0 0 auto;
    display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
    padding: 9px 13px 7px; border-bottom: 1px solid var(--line-soft);
  }
  .panel-head h2 { font-size: 12px; font-weight: 650; margin: 0; letter-spacing: .01em; }
  .panel-head .meta { font-family: var(--mono); font-size: 10px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .panel-head .meta b { color: var(--ink); font-weight: 600; }
  .saved { font-family: var(--mono); font-size: 10px; color: var(--muted); opacity: 0; transition: opacity .2s ease; }
  .saved.on { opacity: 1; }
  .panel-foot { flex: 0 0 auto; padding: 7px 13px 9px; display: flex; justify-content: flex-end; }

  .linkbtn {
    background: none; border: 0; padding: 3px 2px; cursor: pointer;
    color: var(--accent); font-size: 11.5px; font-weight: 600;
    text-decoration: underline; text-underline-offset: 3px;
  }
  .linkbtn.quiet { color: var(--muted); }

  /* ---------- 판매 기록 ----------
     목록은 스크롤하지 않는다 — 자리에 들어가는 만큼만 최근 순으로 보여주고,
     넘치는 나머지는 안내 줄 하나로 알린다(합계·되돌리기는 총 건수 기준이라
     화면에 안 보이는 오래된 기록도 값에는 그대로 반영된다). */
  .log-body { flex: 1 1 auto; min-height: 0; overflow: hidden; display: flex; flex-direction: column; }
  .log { list-style: none; margin: 0; padding: 0; flex: 0 1 auto; overflow: hidden; }
  .log li {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 13px; border-bottom: 1px solid var(--line-soft);
  }
  .log li:last-child { border-bottom: 0; }
  .log .t { font-family: var(--mono); font-size: 9.5px; color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }
  .log .what { font-size: 11.5px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .log .what .opt { color: var(--muted); font-family: var(--mono); font-size: 10px; }
  .log .amt { font-family: var(--mono); font-size: 11px; font-variant-numeric: tabular-nums; flex: none; }
  .log .undo {
    flex: none; border: 1px solid var(--line); background: var(--card); color: var(--muted);
    border-radius: 5px; font-size: 10px; padding: 3px 6px; cursor: pointer;
  }
  .log .undo:hover { border-color: var(--accent); color: var(--accent); }
  .empty { padding: 14px 13px; font-size: 11.5px; color: var(--muted); margin: 0; }
  .log-more {
    flex: none; margin: 0; padding: 5px 13px; font-size: 9.5px; color: var(--muted);
    border-top: 1px dashed var(--line-soft);
  }
  .log-more[hidden] { display: none; }

  /* ---------- 가격 조정 ---------- */
  .scroller { flex: 1 1 auto; min-height: 0; overflow: hidden; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 6px 5px; text-align: right; border-bottom: 1px solid var(--line-soft); white-space: nowrap; }
  th { font-family: var(--mono); font-size: 9px; letter-spacing: .08em; color: var(--muted); font-weight: 500; }
  th:first-child, td:first-child { text-align: left; padding-left: 13px; white-space: normal; }
  td:last-child, th:last-child { padding-right: 13px; }
  tbody tr:last-child td { border-bottom: 0; }
  .row-name { font-size: 11px; line-height: 1.3; }
  .row-name .v { color: var(--muted); font-size: 10px; }
  .money {
    font-family: var(--mono); font-size: 11px; font-variant-numeric: tabular-nums;
    width: 70px; text-align: right; padding: 4px 6px;
    border: 1px solid var(--line); border-radius: 5px;
    background: var(--paper); color: var(--ink);
  }
  .money:disabled { background: transparent; border-color: transparent; color: var(--muted); }
  .margin { font-family: var(--mono); font-size: 11px; font-variant-numeric: tabular-nums; color: var(--muted); }

  /* ---------- 판매 확인 ---------- */
  .scrim {
    position: fixed; inset: 0; z-index: 50; background: rgba(10, 15, 25, .48);
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .scrim[hidden] { display: none; }
  .modal {
    background: var(--card); color: var(--ink); border: 1px solid var(--line);
    border-radius: 14px; width: 100%; max-width: 340px; overflow: hidden;
    box-shadow: 0 24px 60px -20px rgba(0, 0, 0, .5); animation: pop .16s ease-out;
  }
  @keyframes pop { from { transform: scale(.96); opacity: 0; } }
  .modal h2 { margin: 0; font-size: 14px; font-weight: 650; padding: 14px 16px 11px; border-bottom: 1px solid var(--line-soft); }
  .modal dl { margin: 0; padding: 12px 16px 14px; display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; align-items: baseline; }
  .modal dt { font-family: var(--mono); font-size: 10px; letter-spacing: .07em; color: var(--muted); }
  .modal dd { margin: 0; text-align: right; font-size: 13px; }
  .modal dd.fig { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .modal dd .after { color: var(--muted); }
  .actions { display: grid; grid-template-columns: 1fr 1.35fr; gap: 8px; padding: 0 16px 16px; }
  .btn { height: 44px; border-radius: 9px; font-size: 13.5px; font-weight: 650; cursor: pointer; border: 1px solid var(--line); }
  .btn.ghost { background: transparent; color: var(--muted); }
  .btn.go { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); letter-spacing: .04em; }
  .btn:hover { opacity: .88; }

  /* ---------- 알림 ---------- */
  .toast {
    position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 10px);
    background: var(--ink); color: var(--card);
    font-family: var(--mono); font-size: 11.5px; font-variant-numeric: tabular-nums;
    padding: 8px 14px; border-radius: 999px;
    opacity: 0; pointer-events: none;
    transition: opacity .18s ease, transform .18s ease; z-index: 60;
  }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>

<div class="band"></div>

<main class="wrap">
  <header class="masthead">
    <h1>레터스 굿즈 재고</h1>
    <div class="head-actions">
      <p class="tally" id="tally"></p>
      <div class="backup-actions">
        <button type="button" class="miniBtn" id="exportBtn">백업 저장</button>
        <button type="button" class="miniBtn" id="importBtn">백업 불러오기</button>
        <input type="file" id="importFile" accept="application/json" hidden>
      </div>
    </div>
  </header>

  <div class="board">
    <section class="stock-list" id="list" aria-label="재고 품목"></section>

    <aside class="side">
      <section class="panel" aria-labelledby="logTitle">
        <div class="panel-head">
          <h2 id="logTitle">판매 기록</h2>
          <span class="meta" id="logMeta"></span>
        </div>
        <div class="log-body" id="logBody">
          <ul class="log" id="log"></ul>
          <p class="empty" id="logEmpty">아직 판매 기록이 없습니다.</p>
          <p class="log-more" id="logMore" hidden></p>
        </div>
        <div class="panel-foot">
          <button type="button" class="linkbtn quiet" id="clearLog">기록 비우기</button>
        </div>
      </section>

      <section class="panel" aria-labelledby="priceTitle">
        <div class="panel-head">
          <h2 id="priceTitle">가격 조정</h2>
          <span class="saved" id="saved">저장됨</span>
        </div>
        <div class="scroller">
          <table>
            <thead><tr><th>품목</th><th>원가</th><th>판매가</th><th>마진</th></tr></thead>
            <tbody id="ledgerBody"></tbody>
          </table>
        </div>
        <div class="panel-foot">
          <button type="button" class="linkbtn" id="resetBtn">전체 초기화</button>
        </div>
      </section>
    </aside>
  </div>
</main>

<div class="scrim" id="scrim" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <h2 id="modalTitle">판매 확인</h2>
    <dl>
      <dt>품목</dt><dd id="mItem"></dd>
      <dt>옵션</dt><dd id="mOpt"></dd>
      <dt>판매가</dt><dd class="fig" id="mPrice"></dd>
      <dt>판매 후</dt><dd class="fig" id="mAfter"></dd>
    </dl>
    <div class="actions">
      <button type="button" class="btn ghost" id="cancelBtn">취소</button>
      <button type="button" class="btn go" id="confirmBtn">판매 확정</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  var SIZES = ['S', 'M', 'L', 'XL', '2XL', '3XL'];
  var SIZE_STOCK = { S: 10, M: 10, L: 13, XL: 10, '2XL': 5, '3XL': 2 };

  var ITEMS = [
    { id: 'keyring-seal',   name: '레터스 키캡 키링',        variant: '우편실링',  unit: '개',   cost: 3500, price: 5000,  stock: 46 },
    { id: 'keyring-letter', name: '레터스 키캡 키링',        variant: '편지봉투',  unit: '개',   cost: 3500, price: 5000,  stock: 48 },
    { id: 'tee-black',      name: '레터스 티셔츠',           variant: '검정',      unit: '장',   cost: 8000, price: 12000, sizes: true },
    { id: 'tee-white',      name: '레터스 티셔츠',           variant: '흰색',      unit: '장',   cost: 8000, price: 12000, sizes: true },
    { id: 'sticker-black',  name: '레터스 카드 커버 스티커', variant: '블랙',      unit: '개',   cost: null, price: 1500,  stock: 113 },
    { id: 'sticker-white',  name: '레터스 카드 커버 스티커', variant: '화이트',    unit: '개',   cost: null, price: 1500,  stock: 109 },
    { id: 'sticker-beige',  name: '레터스 카드 커버 스티커', variant: '베이지',    unit: '개',   cost: null, price: 1500,  stock: 112 }
  ];

  var KEY = 'letters-goods-v2';
  var byId = {};
  ITEMS.forEach(function (it) { byId[it.id] = it; });

  /* ---------- 상태 ---------- */

  function initialState() {
    var s = { stock: {}, prices: {}, log: [] };
    ITEMS.forEach(function (it) {
      if (it.sizes) s.stock[it.id] = Object.assign({}, SIZE_STOCK);
      else if (it.stock !== undefined) s.stock[it.id] = it.stock;
      s.prices[it.id] = { cost: it.cost, price: it.price };
    });
    return s;
  }

  var state = load();
  var pending = null;
  var seq = 0;
  var lastSavedAt = null;
  var lastSaveError = false;

  // localStorage에서 불러올 때도, 백업 파일을 불러올 때도 같은 검증을 거친다.
  // 형식이 깨졌거나 다른 물건 목록에서 만든 파일이어도 죽지 않고,
  // 알아볼 수 있는 값만 골라 쓰고 나머지는 초기값으로 채운다.
  function sanitizeState(saved) {
    var fresh = initialState();
    if (!saved || typeof saved !== 'object') return fresh;
    var src = (saved.state && typeof saved.state === 'object') ? saved.state : saved;

    ITEMS.forEach(function (it) {
      var ss = src.stock && src.stock[it.id];
      if (it.sizes) {
        if (ss && typeof ss === 'object') {
          SIZES.forEach(function (sz) {
            if (typeof ss[sz] === 'number' && ss[sz] >= 0) fresh.stock[it.id][sz] = ss[sz];
          });
        }
      } else if (typeof ss === 'number' && ss >= 0) {
        fresh.stock[it.id] = ss;
      }
      var sp = src.prices && src.prices[it.id];
      if (sp) {
        if (typeof sp.price === 'number' && sp.price >= 0) fresh.prices[it.id].price = sp.price;
        if (typeof sp.cost === 'number' && sp.cost >= 0) fresh.prices[it.id].cost = sp.cost;
      }
    });

    if (Array.isArray(src.log)) {
      fresh.log = src.log.map(function (e) {
        if (!e || typeof e !== 'object') return null;
        var it = byId[e.id];
        if (!it) return null;
        var size = it.sizes ? (SIZES.indexOf(e.size) >= 0 ? e.size : null) : null;
        if (it.sizes && !size) return null;
        if (typeof e.price !== 'number' || e.price < 0) return null;
        var at = (typeof e.at === 'string' && !isNaN(new Date(e.at).getTime())) ? e.at : new Date().toISOString();
        return {
          key: (typeof e.key === 'string' && e.key) ? e.key : (at + '-' + Math.random().toString(36).slice(2)),
          at: at, id: e.id, size: size,
          name: it.name, option: optionOf(it, size), price: e.price
        };
      }).filter(Boolean);
    }
    return fresh;
  }

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return initialState();
      return sanitizeState(JSON.parse(raw));
    } catch (e) { return initialState(); }
  }

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); lastSaveError = false; }
    catch (e) { lastSaveError = true; /* 저장 공간이 꽉 찼거나 저장이 막힌 경우 */ }
    lastSavedAt = new Date();
  }

  /* ---------- 재고 계산 ---------- */

  function available(id, size) {
    if (byId[id].sizes) return state.stock[id][size] || 0;
    return state.stock[id];
  }

  function totalOf(id) {
    if (byId[id].sizes) return SIZES.reduce(function (a, sz) { return a + (state.stock[id][sz] || 0); }, 0);
    return available(id);
  }

  function applySale(id, size, dir) {
    if (byId[id].sizes) {
      state.stock[id][size] -= dir;
    } else {
      state.stock[id] -= dir;
    }
  }

  var won = function (n) { return n.toLocaleString('ko-KR') + '원'; };

  function optionOf(it, size) { return size ? it.variant + ' · ' + size : it.variant; }

  /* ---------- 카드 ---------- */

  var list = document.getElementById('list');
  var tally = document.getElementById('tally');

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  // 카드는 한 번만 만들고 이후에는 값만 고친다.
  // 매번 다시 그리면 누르는 순간 버튼이 교체돼 연속 터치를 놓친다.
  function buildCard(it) {
    var root = el('article', 'item');

    var head = el('div', 'item-head');
    var left = el('div');
    left.appendChild(el('span', 'variant', it.variant));
    left.appendChild(el('div', 'name', it.name));
    var tagEl = el('div', 'tag');
    left.appendChild(tagEl);
    head.appendChild(left);

    var count = el('div', 'count');
    var nEl = el('span', 'n');
    var flagEl = el('span', 'flag');
    flagEl.hidden = true;
    count.appendChild(nEl);
    count.appendChild(el('span', 'u', it.unit));
    count.appendChild(flagEl);
    head.appendChild(count);
    root.appendChild(head);

    var buttons = [];

    if (it.sizes) {
      var grid = el('div', 'size-grid');
      SIZES.forEach(function (sz) {
        var b = el('button', 'szbtn');
        b.type = 'button';
        b.appendChild(el('span', 'sz', sz));
        var leftEl = el('span', 'left');
        b.appendChild(leftEl);
        b.addEventListener('click', function () { openModal(it.id, sz); });
        grid.appendChild(b);
        buttons.push({ size: sz, node: b, leftNode: leftEl });
      });
      root.appendChild(grid);
    } else {
      var one = el('button', 'sell');
      one.type = 'button';
      one.addEventListener('click', function () { openModal(it.id, null); });
      root.appendChild(one);
      buttons.push({ size: null, node: one });
    }

    function refresh() {
      var total = totalOf(it.id);
      root.classList.toggle('out', total === 0);
      tagEl.textContent = won(state.prices[it.id].price);
      nEl.textContent = total.toLocaleString('ko-KR');
      count.classList.toggle('low', total > 0 && total <= 5);
      flagEl.hidden = total > 5;
      flagEl.textContent = total === 0 ? '품절' : '품절임박';

      buttons.forEach(function (b) {
        var n = available(it.id, b.size);
        b.node.disabled = n === 0;
        if (b.leftNode) {
          b.leftNode.textContent = n + '장';
          b.node.setAttribute('aria-label', it.variant + ' ' + b.size + ' 판매, ' + n + '장 남음');
        } else {
          b.node.textContent = n === 0 ? '품절' : '판매';
        }
      });
    }

    return { root: root, refresh: refresh };
  }

  var cards = ITEMS.map(buildCard);
  cards.forEach(function (c) { list.appendChild(c.root); });

  function pad2(n) { return String(n).padStart(2, '0'); }

  function refreshAll() {
    cards.forEach(function (c) { c.refresh(); });
    renderLog();
    refreshLedger();
    save();

    var sum = ITEMS.reduce(function (a, it) { return a + totalOf(it.id); }, 0);
    var savedTxt = lastSaveError
      ? '<span class="save-warn">저장 안 됨</span>'
      : '저장 ' + pad2(lastSavedAt.getHours()) + ':' + pad2(lastSavedAt.getMinutes());
    tally.innerHTML = '남은 재고 <b>' + sum.toLocaleString('ko-KR') + '</b>점 · ' + savedTxt;
  }

  /* ---------- 판매 확인 ---------- */

  var scrim = document.getElementById('scrim');
  var confirmBtn = document.getElementById('confirmBtn');
  var lastFocus = null;

  function openModal(id, size) {
    var it = byId[id];
    if (available(id, size) <= 0) return;
    pending = { id: id, size: size };
    lastFocus = document.activeElement;

    document.getElementById('mItem').textContent = it.name;
    document.getElementById('mOpt').textContent = optionOf(it, size);
    document.getElementById('mPrice').textContent = won(state.prices[id].price);
    document.getElementById('mAfter').innerHTML =
      (available(id, size) - 1).toLocaleString('ko-KR') + it.unit + ' <span class="after">남음</span>';

    scrim.hidden = false;
    confirmBtn.focus();
  }

  function closeModal() {
    scrim.hidden = true;
    pending = null;
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }

  confirmBtn.addEventListener('click', function () {
    if (!pending) return;
    var id = pending.id, size = pending.size, it = byId[id];
    if (available(id, size) <= 0) { closeModal(); refreshAll(); return; }

    applySale(id, size, 1);
    state.log.unshift({
      key: Date.now() + '-' + (seq++),
      at: new Date().toISOString(),
      id: id,
      size: size,
      name: it.name,
      option: optionOf(it, size),
      price: state.prices[id].price
    });

    closeModal();
    refreshAll();
    toast('판매 기록됨 · ' + won(state.prices[id].price));
  });

  document.getElementById('cancelBtn').addEventListener('click', closeModal);
  scrim.addEventListener('mousedown', function (e) { if (e.target === scrim) closeModal(); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !scrim.hidden) closeModal();
  });

  /* ---------- 판매 기록 ---------- */

  var logBody = document.getElementById('logBody');
  var logEl = document.getElementById('log');
  var logEmpty = document.getElementById('logEmpty');
  var logMore = document.getElementById('logMore');
  var logMeta = document.getElementById('logMeta');

  function hhmm(iso) {
    var d = new Date(iso);
    if (isNaN(d)) return '--:--';
    return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }

  function renderLog() {
    logEl.textContent = '';
    state.log.forEach(function (e) {
      var li = el('li');
      li.appendChild(el('span', 't', hhmm(e.at)));

      var what = el('span', 'what');
      what.appendChild(document.createTextNode(e.name + ' '));
      what.appendChild(el('span', 'opt', e.option));
      li.appendChild(what);

      li.appendChild(el('span', 'amt', won(e.price)));

      var undo = el('button', 'undo', '취소');
      undo.type = 'button';
      undo.setAttribute('aria-label', e.name + ' ' + e.option + ' 판매 취소');
      undo.addEventListener('click', function () { undoSale(e.key); });
      li.appendChild(undo);

      logEl.appendChild(li);
    });

    var revenue = state.log.reduce(function (a, e) { return a + e.price; }, 0);
    logEmpty.hidden = state.log.length > 0;
    logMeta.innerHTML = state.log.length
      ? '<b>' + state.log.length + '</b>건 · 매출 <b>' + won(revenue) + '</b>'
      : '';

    fitLog();
  }

  // 기록은 스크롤하지 않는다 — 자리에 들어가는 만큼만 최근 순으로 보여주고,
  // 넘치는 나머지는 안내 줄로 알린다. 위쪽 건수·매출·재고 계산은 화면에
  // 안 보이는 기록도 포함해 항상 정확하다.
  function fitLog() {
    var rows = Array.prototype.slice.call(logEl.children);
    if (!rows.length) { logMore.hidden = true; return; }

    // .log는 .log-body의 맨 위에 여백 없이 붙어 있으니 그 높이가 곧 가용 공간이다.
    // offsetTop은 가장 가까운 position 조상(대개 <body>) 기준이라 여기 쓰면 안 된다.
    var avail = logBody.clientHeight;
    rows.forEach(function (li) { li.style.display = ''; });

    var used = 0, shown = 0;
    for (var i = 0; i < rows.length; i++) {
      used += rows[i].offsetHeight;
      if (used > avail) break;
      shown = i + 1;
    }

    if (shown >= rows.length) { logMore.hidden = true; return; }

    logMore.hidden = false;
    var budget = avail - logMore.offsetHeight;
    used = 0; shown = 0;
    for (var j = 0; j < rows.length; j++) {
      used += rows[j].offsetHeight;
      if (used > budget) break;
      shown = j + 1;
    }
    rows.forEach(function (li, idx) { li.style.display = idx < shown ? '' : 'none'; });
    logMore.textContent = '이전 ' + (rows.length - shown) + '건은 기록에 포함되어 있지만 화면에는 표시되지 않습니다';
  }

  var fitLogResizeTimer = null;
  window.addEventListener('resize', function () {
    clearTimeout(fitLogResizeTimer);
    fitLogResizeTimer = setTimeout(fitLog, 120);
  });

  function undoSale(key) {
    var i = state.log.findIndex(function (e) { return e.key === key; });
    if (i < 0) return;
    var e = state.log[i];
    applySale(e.id, e.size, -1);   // 판매의 정확한 역연산
    state.log.splice(i, 1);
    refreshAll();
    toast('판매를 취소했습니다');
  }

  document.getElementById('clearLog').addEventListener('click', function () {
    if (!state.log.length) return;
    if (!confirm('판매 기록만 지웁니다. 재고는 그대로 둡니다. 계속할까요?')) return;
    state.log = [];
    refreshAll();
    toast('기록을 비웠습니다');
  });

  /* ---------- 가격 조정 ---------- */

  var ledgerBody = document.getElementById('ledgerBody');
  var savedTag = document.getElementById('saved');
  var savedTimer = null;
  var ledgerRows = [];

  ITEMS.forEach(function (it) {
    var tr = el('tr');

    var nameCell = el('td', 'row-name');
    nameCell.appendChild(document.createTextNode(it.name.replace(/^레터스 /, '') + ' '));
    nameCell.appendChild(el('span', 'v', '(' + it.variant + ')'));
    tr.appendChild(nameCell);

    var costInput = priceInput(it.id, 'cost', it.cost === null);
    var priceField = priceInput(it.id, 'price', false);
    tr.appendChild(cell(costInput));
    tr.appendChild(cell(priceField));

    var marginCell = el('td', 'margin');
    tr.appendChild(marginCell);

    ledgerBody.appendChild(tr);
    ledgerRows.push({ id: it.id, cost: costInput, price: priceField, margin: marginCell });
  });

  function refreshLedger() {
    ledgerRows.forEach(function (row) {
      var p = state.prices[row.id];
      // 입력 중인 칸은 건드리지 않는다.
      if (document.activeElement !== row.cost) row.cost.value = p.cost == null ? '' : p.cost;
      if (document.activeElement !== row.price) row.price.value = p.price == null ? '' : p.price;
      row.margin.textContent = p.cost == null ? '—' : (p.price - p.cost).toLocaleString('ko-KR');
    });
  }

  function cell(node) { var td = el('td'); td.appendChild(node); return td; }

  function priceInput(id, field, none) {
    var input = document.createElement('input');
    input.className = 'money';
    input.type = 'number';
    input.min = '0';
    input.step = '100';
    input.inputMode = 'numeric';
    input.disabled = none;
    input.placeholder = none ? '—' : '0';
    input.setAttribute('aria-label',
      byId[id].name + ' ' + byId[id].variant + ' ' + (field === 'cost' ? '원가' : '판매가'));
    input.addEventListener('change', function () {
      var n = parseInt(input.value, 10);
      if (isNaN(n) || n < 0) {
        var cur = state.prices[id][field];
        input.value = cur == null ? '' : cur;
        return;
      }
      state.prices[id][field] = n;   // 이미 기록된 판매 금액은 그대로 둔다
      refreshAll();
      flashSaved();
    });
    return input;
  }

  function flashSaved() {
    savedTag.classList.add('on');
    clearTimeout(savedTimer);
    savedTimer = setTimeout(function () { savedTag.classList.remove('on'); }, 1400);
  }

  document.getElementById('resetBtn').addEventListener('click', function () {
    if (!confirm('재고, 판매 기록, 가격을 처음 상태로 되돌립니다. 계속할까요?')) return;
    state = initialState();
    refreshAll();
    toast('처음 상태로 되돌렸습니다');
  });

  /* ---------- 백업 저장 · 불러오기 ----------
     재고는 이 브라우저에만 저장되므로(자동 저장, 위 "저장 HH:MM" 참고),
     기기를 바꾸거나 브라우저 데이터가 지워질 경우를 대비해 파일로 따로
     내보내고 불러올 수 있게 한다. */

  function exportBackup() {
    var payload = { version: 1, exportedAt: new Date().toISOString(), state: state };
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var d = new Date();
    var stamp = d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate()) + '-' + pad2(d.getHours()) + pad2(d.getMinutes());

    var a = document.createElement('a');
    a.href = url;
    a.download = '레터스-굿즈-백업-' + stamp + '.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
    toast('백업 파일을 저장했습니다');
  }

  document.getElementById('exportBtn').addEventListener('click', exportBackup);

  var importFile = document.getElementById('importFile');
  document.getElementById('importBtn').addEventListener('click', function () { importFile.click(); });

  importFile.addEventListener('change', function () {
    var file = importFile.files && importFile.files[0];
    importFile.value = ''; // 같은 파일을 다시 고를 수 있도록 비워둔다
    if (!file) return;

    var reader = new FileReader();
    reader.onload = function () {
      var parsed;
      try { parsed = JSON.parse(String(reader.result)); }
      catch (e) { alert('백업 파일을 읽을 수 없습니다. 파일 형식을 확인해 주세요.'); return; }

      if (!confirm('백업 파일을 불러오면 지금 화면의 재고·판매 기록·가격을 덮어씁니다. 계속할까요?')) return;
      state = sanitizeState(parsed);
      refreshAll();
      toast('백업을 불러왔습니다');
    };
    reader.onerror = function () { alert('파일을 읽는 중 문제가 생겼습니다.'); };
    reader.readAsText(file);
  });

  /* ---------- 알림 ---------- */

  var toastEl = document.getElementById('toast');
  var toastTimer = null;

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('on'); }, 1800);
  }

  refreshAll();
})();
</script>
</body>
</html>
