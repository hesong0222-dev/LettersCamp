<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><meta name="description" content="Letters Camp 운영 컨트롤 타워"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="assets/icon.svg"><title>Letters Camp Control</title><style>

tton{min-height:48px;border-radius:10px;border:0;font-weight:750}.fieldbtns .ok{background:#fff;color:#111827}.fieldbtns .help{background:#c23b55;color:#fff}.mobile{display:none}.modal{position:fixed;inset:0;background:#10182888;z-index:20;display:grid;place-items:center;padding:18px}.modal>div{background:#fff;border-radius:15px;width:min(520px,100%);padding:18px}.modal h3{margin-top:0}.modal input,.modal textarea,.modal select{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;margin:5px 0 9px}.hidden{display:none!important}@media(max-width:900px){.app{display:block}.side{display:none}.top{height:62px;padding:0 14px}.top small{display:none}.content{padding:14px 14px 80px}.hero{grid-template-columns:1fr}.hero h2{font-size:24px}.kpis{grid-template-columns:1fr 1fr}.grid2,.kanban{grid-template-columns:1fr}.mobile{position:fixed;display:grid;grid-template-columns:repeat(5,1fr);bottom:0;left:0;right:0;z-index:10;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}.mobile button{height:58px;border:0;background:#fff;font-size:10px}.mobile button.on{color:var(--red);font-weight:800}table{font-size:12px}.hideMob{display:none}} 
</style></head><body><div class="app"><aside class="side"><div class="brand">LETTERS<small>Camp Control</small></div><nav id="nav" class="nav"></nav><div class="sidefoot">이 기기에 자동 저장<br><a href="legacy-goods.html">기존 굿즈 재고</a></div></aside><section class="main"><header class="top"><div><small>2026 레터스 여름캠프 · 제주</small><h1 id="title">홈 대시보드</h1></div><div class="actions"><button class="btn" onclick="backup()">백업</button><button class="btn primary" onclick="openModal('task')">+ 업무</button></div></header><main class="content" id="view"></main></section></div><nav class="mobile" id="mobile"></nav><div id="modal" class="hidden"></div><script>
const N=[['dashboard','⌂ 홈'],['schedule','▦ 일정'],['tasks','✓ 업무'],['people','◎ 사람·역할'],['materials','◇ 자료'],['inventory','□ 물품'],['participants','♙ 참가자'],['field','⚡ 현장']];
const seed={sessions:[['14:50','15:00','웨이홈 장비 하차','본관 주차장','준호',82,'warn'],['15:00','16:20','개회예배 리허설','대강당','서윤',64,'danger'],['17:00','18:30','개회예배','대강당','소연',79,'warn'],['19:30','21:00','토크 콘서트','대강당','민준',68,'danger'],['08:30','09:30','오전예배','대강당','서윤',100,'ready'],['14:00','16:00','미니올림픽','운동장','민준',72,'warn'],['19:30','21:30','저녁예배','대강당','소연',86,'warn'],['09:30','11:00','폐회예배','대강당','소연',92,'warn'],['11:00','12:00','철수·회수','전 구역','준호',74,'warn']],tasks:[['오프닝 영상 최종본 승인','은찬','오늘 18:00','review'],['토크 콘서트 촬영 담당 배정','하람','오늘 20:00','todo'],['HDMI 10m 1개 구매','준호','내일 12:00','progress'],['우천 대체 프로그램 확정','민준','내일 18:00','todo'],['차량별 적재표 검수','태훈','D-1 15:00','done']],people:[['하엘','총괄','전체','수락'],['민준','프로그램','8/25–28','수락'],['서윤','찬양','8/26–28','수락'],['도현','음향','8/25–28','수락'],['유진','안전','전체','수락'],['은찬','영상','14시 이후','수락'],['지우','자막','8/25–28','수락'],['하람','촬영','8/26–28','수락'],['준호','장비','8/25–28','수락']],materials:[['개회예배 찬양 콘티','PDF','v4','최종본','서윤'],['오프닝 영상','MP4','v3','검토 요청','은찬'],['토크 콘서트 큐시트','DOC','v2','수정 필요','민준'],['설교 제목 화면','PNG','v2','승인','지우'],['미니올림픽 우천 대체안','DOC','v1','초안','민준']],inventory:[['HDMI 케이블 10m','영상','3','2','구매 필요','1호차'],['무선마이크 세트','음향','4','4','포장','1호차'],['카메라 SD 256GB','촬영','6','4','구매 필요','1호차'],['우비','안전','30','10','미확보','2호차'],['멀티탭 5구','전기','8','8','적재','1호차'],['무전기','운영','12','12','포장','1호차']],participants:[['김지민','양주산성교회','1조','A-201','1호차','완료'],['박현우','양주산성교회','2조','B-201','1호차','완료'],['이서아','새길교회','3조','A-202','2호차','미납'],['최유나','새길교회','3조','A-202','2호차','완료'],['정민재','은혜교회','4조','B-202','3호차','완료'],['강수아','양주산성교회','5조','A-203','1호차','완료']],issues:[['카메라 2 담당 미배정','사람','긴급'],['HDMI 10m 1개 부족','물품','주의'],['우천 시 운동장 사용 불가','안전','긴급']],ann:['오전예배 연습 08:20 → 08:30','토크 콘서트 영상 담당 미배정','1호차 적재 위치 변경']};
let S=JSON.parse(localStorage.campControl||'null')||seed;let route=location.hash.slice(1)||'dashboard';const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.campControl=JSON.stringify(S)}function tone(x){return x==='ready'||x==='완료'||x==='최종본'||x==='승인'?'green':x==='danger'||x==='미납'||x==='미확보'||x==='수정 필요'?'red':x==='warn'||x==='구매 필요'||x==='검토 요청'?'amber':'blue'}function chip(x){return `<span class="chip ${tone(x)}">${esc(x)}</span>`}function table(head,rows){return `<table><thead><tr>${head.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((x,i)=>`<td>${i===r.length-1?chip(x):esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table>`}
function dashboard(){return `<section class="hero"><div><small>그리스도의 편지가 되어 · 고후 3:3</small><h2>2026 레터스 여름캠프</h2><p>이기풍선교기념관 · 제주 · 8.26–8.28</p><div style="margin-top:18px">전체 준비율 <b>76%</b><div class="progress" style="margin-top:7px"><i style="width:76%"></i></div></div></div><div class="dday"><small>STARTS IN</small><b>D-3</b></div></section><section class="kpis">${[['미해결 위험','8','red'],['오늘 마감','5','amber'],['미배정 역할','2','red'],['미확인 변경','3','blue']].map(x=>`<div class="card kpi"><span class="mut">${x[0]}</span><b>${x[1]}</b><span class="chip ${x[2]}">확인 필요</span></div>`).join('')}</section><section class="grid2"><div class="card"><div class="sec"><h3>24시간 안의 핵심 세션</h3><div class="list">${S.sessions.slice(0,4).map(s=>`<div class="item"><div><strong>${s[2]}</strong><small class="mut">${s[0]}–${s[1]} · ${s[3]} · ${s[4]}</small></div><div style="min-width:100px"><small>${s[5]}%</small><div class="progress"><i style="width:${s[5]}%"></i></div></div></div>`).join('')}</div></div></div><div class="card"><h3>지금 막아야 할 것</h3><div class="list">${S.issues.map(i=>`<div class="item"><div><strong>${i[0]}</strong><small class="mut">${i[1]}</small></div>${chip(i[2])}</div>`).join('')}</div></div></section><section class="sec"><h3>최근 중요 변경</h3><div class="list">${S.ann.map((a,i)=>`<div class="item"><div><strong>${a}</strong><small class="mut">대상 팀만 확인 필요</small></div>${chip(i?'미확인':'확인 중')}</div>`).join('')}</div></section>`}
function schedule(){return `<div class="tabs"><button class="on">8/26</button><button>8/27</button><button>8/28</button></div>${table(['시간','세션','장소','책임자','준비'],S.sessions.map(s=>[s[0]+'–'+s[1],s[2],s[3],s[4],s[5]+'%']))}<div class="card sec"><h3>세션 준비 완료 조건</h3><p class="mut">책임자 · 필수 역할 수락 · 큐시트 승인 · 자료 최종본 · 장비 확보 · 장소 확인 · 리허설 · 안전 확인을 모두 통과해야 완료 처리됩니다.</p></div>`}
function tasks(){let cols=[['todo','할 일'],['progress','진행 중'],['review','검토'],['done','완료']];return `<div class="kanban">${cols.map(c=>`<div class="col"><h4>${c[1]}</h4>${S.tasks.filter(t=>t[3]===c[0]).map((t,i)=>`<div class="task"><strong>${t[0]}</strong><div class="mut">${t[1]} · ${t[2]}</div><button class="btn" style="margin-top:8px" onclick="advance('${esc(t[0])}')">다음 상태</button></div>`).join('')||'<small class="mut">없음</small>'}</div>`).join('')}</div><div class="card sec"><h3>카카오 메시지 → 업무 후보</h3><p class="mut">예: “프로그램 기획서와 예산안 토요일까지 작성해주세요.”를 붙여넣고 운영자가 확인한 뒤 업무로 등록합니다.</p><button class="btn primary" onclick="openModal('extract')">메시지에서 업무 만들기</button></div>`}
function people(){return `${table(['이름','팀','가용시간','상태'],S.people)}<div class="card sec"><h3>충돌 검사</h3><div class="list"><div class="item"><strong>하람 · 촬영 + 사진 역할 중복</strong>${chip('주의')}</div><div class="item"><strong>토크 콘서트 동영상 담당 미배정</strong>${chip('긴급')}</div><div class="item"><strong>촬영 역할 백업 담당 없음</strong>${chip('주의')}</div></div></div>`}
function materials(){return table(['자료','형식','버전','상태','담당'],S.materials)}function inventory(){return `${table(['품목','분류','필요','보유','상태','차량'],S.inventory)}<div class="card sec"><h3>자동 목록</h3><p>구매: HDMI 10m 1개 · SD 256GB 2개 · 우비 20개</p><p>1호차: HDMI · 무선마이크 · SD카드 · 멀티탭 · 무전기</p></div>`}function participants(){return `${table(['이름','교회','조','숙소','차량','납부'],S.participants)}<div class="card sec"><h3>배정 검사</h3><p class="mut">교회 간 교류, 학년·성별, 조별 인원, 숙소 정원과 같은 조 요청을 기준으로 제안하고 최종 확정은 운영자가 합니다.</p></div>`}
function field(){return `<div class="field"><div class="now"><small>지금 · 14:52</small><h2>웨이홈 장비 하차</h2><p>본관 주차장 · 촬영팀 / 장비팀</p><div class="time">00:08</div><small>다음 15:00 개회예배 리허설 · 오프닝 영상 최종본 확인 필요</small><div class="fieldbtns"><button class="ok" onclick="toast('준비 완료 처리')">준비 완료</button><button class="help" onclick="openModal('issue')">도움 요청</button></div></div><div class="card sec"><h3>오늘 내 역할</h3><div class="list"><div class="item"><strong>14:50 장비 하차</strong>${chip('지금')}</div><div class="item"><strong>15:00 개회예배 리허설</strong>${chip('다음')}</div><div class="item"><strong>19:30 토크 콘서트</strong>${chip('예정')}</div></div></div><div class="card sec"><h3>비상 연락처</h3><p>현장 총괄 하엘 · 010-0000-1020<br>안전·의료 유진 · 010-0000-1024</p></div></div>`}
const views={dashboard,schedule,tasks,people,materials,inventory,participants,field};function render(){route=location.hash.slice(1)||route;$('#title').textContent=(N.find(x=>x[0]===route)||['','홈'])[1].replace(/^\S+\s/,'');$('#nav').innerHTML=N.map(n=>`<button class="${n[0]===route?'on':''}" onclick="go('${n[0]}')">${n[1]}</button>`).join('');$('#mobile').innerHTML=N.filter((_,i)=>[0,1,2,6,7].includes(i)).map(n=>`<button class="${n[0]===route?'on':''}" onclick="go('${n[0]}')">${n[1]}</button>`).join('');$('#view').innerHTML=(views[route]||dashboard)()}function go(r){location.hash=r}onhashchange=render;
function advance(title){let t=S.tasks.find(x=>x[0]===title),order=['todo','progress','review','done'];if(t)t[3]=order[Math.min(order.indexOf(t[3])+1,3)];save();render()}function openModal(type){let h=type==='task'?'<h3>새 업무</h3><input id="mTitle" placeholder="업무명"><input id="mOwner" placeholder="담당자"><input id="mDue" placeholder="마감"><button class="btn primary" onclick="addTask()">등록</button>':type==='extract'?'<h3>메시지에서 업무 후보</h3><textarea id="msg" rows="5">프로그램 기획서와 예산안 토요일까지 작성해주세요.</textarea><button class="btn primary" onclick="extractTask()">후보 생성</button>':'<h3>현장 문제 신고</h3><input id="mIssue" placeholder="문제 내용"><select id="mSeverity"><option>주의</option><option>긴급</option></select><button class="btn primary" onclick="addIssue()">신고</button>';$('#modal').className='modal';$('#modal').innerHTML=`<div>${h}<button class="btn" style="float:right" onclick="closeModal()">닫기</button></div>`}function closeModal(){$('#modal').className='hidden'}function addTask(){let v=$('#mTitle').value.trim();if(v)S.tasks.push([v,$('#mOwner').value||'미배정',$('#mDue').value||'미정','todo']);save();closeModal();go('tasks');render()}function extractTask(){let m=$('#msg').value.trim();if(m)S.tasks.push([m.replace(/해주세요[.!]?$/,'').slice(0,42),'프로그램 담당자','해당 토요일','todo']);save();closeModal();go('tasks');render()}function addIssue(){let v=$('#mIssue').value.trim();if(v)S.issues.unshift([v,'현장',$('#mSeverity').value]);save();closeModal();toast('문제가 등록되었습니다')}function toast(m){alert(m)}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download='letters-camp-backup.json';a.click()}render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
